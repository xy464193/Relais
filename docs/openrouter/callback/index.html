<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Relais OpenRouter Callback</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0b1220;
      color: #f4f7fb;
    }

    main {
      width: min(92vw, 440px);
      padding: 28px 24px;
      border-radius: 18px;
      background: rgba(18, 25, 41, 0.92);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.28);
    }

    h1 {
      margin: 0 0 12px;
      font-size: 24px;
      line-height: 1.2;
    }

    p {
      margin: 0;
      color: #c9d5e7;
      line-height: 1.5;
    }

    .status {
      margin-top: 16px;
      font-size: 14px;
      color: #9ab0cf;
    }

    .actions {
      margin-top: 20px;
      display: none;
      gap: 12px;
      flex-wrap: wrap;
    }

    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 0 16px;
      border-radius: 12px;
      color: #0b1220;
      background: #8ab4ff;
      text-decoration: none;
      font-weight: 600;
    }

    a.secondary {
      color: #f4f7fb;
      background: rgba(255, 255, 255, 0.08);
    }
  </style>
</head>
<body>
  <main>
    <h1>Returning to Relais</h1>
    <p id="message">OpenRouter authorization finished. Relais should reopen automatically.</p>
    <p class="status" id="status">Preparing redirect…</p>
    <div class="actions" id="actions">
      <a id="open-app" href="#">Open Relais</a>
      <a class="secondary" href="https://openrouter.ai/settings/keys">OpenRouter Keys</a>
    </div>
  </main>
  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const hash = window.location.hash || "";
      const appUrl = "relais://openrouter/oauth" + window.location.search + hash;
      const openApp = document.getElementById("open-app");
      const actions = document.getElementById("actions");
      const message = document.getElementById("message");
      const status = document.getElementById("status");

      openApp.href = appUrl;

      if (params.get("error")) {
        message.textContent = "OpenRouter returned an authorization error.";
        status.textContent = "Tap Open Relais to continue and view the error in the app.";
      } else if (params.get("code")) {
        message.textContent = "OpenRouter authorization finished. Relais should reopen automatically.";
        status.textContent = "Redirecting to the app…";
      } else {
        message.textContent = "No authorization code was found in this callback.";
        status.textContent = "Tap Open Relais to return, then retry the sign-in flow.";
      }

      window.location.replace(appUrl);

      window.setTimeout(function () {
        status.textContent = "If Relais did not reopen, use the button below.";
        actions.style.display = "flex";
      }, 1400);
    })();
  </script>
</body>
</html>
